<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Fly Income - Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; }
        .container { max-width: 400px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .card { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .card h3 { font-size: 24px; color: #4ade80; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input { width: 100%; padding: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        button:hover { background: #0369a1; }
        .ref-box { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 13px; word-break: break-all; border: 1px dashed #38bdf8; margin-top: 5px; color: #38bdf8; text-align: left; }
        .hidden { display: none; }
        .stats-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .stats-card { flex: 1; background: #334155; padding: 12px; border-radius: 8px; text-align: center; }
        .stats-card h4 { color: #38bdf8; font-size: 18px; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTH SECTION (Login / Register) -->
    <div id="authSection">
        <h2 id="authTitle">🔐 User Register</h2>
        <div class="form-group">
            <label>Phone Number / Username</label>
            <input type="text" id="username" placeholder="Enter phone or username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button id="authBtn" onclick="handleAuth()">Register Now</button>
        <p style="text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; cursor: pointer;" onclick="toggleAuthMode()">
            Already have an account? <span id="toggleText" style="color: #38bdf8; text-decoration: underline;">Login here</span>
        </p>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection" class="hidden">
        <h2>🚀 Dream Fly Income</h2>
        
        <div class="card">
            <p>Total Balance</p>
            <h3 id="userBalance">$10.00</h3>
        </div>

        <div class="stats-row">
            <div class="stats-card">
                <p style="font-size: 12px; color: #94a3b8;">Total Referrals</p>
                <h4 id="refCount">0</h4>
            </div>
            <div class="stats-card">
                <p style="font-size: 12px; color: #94a3b8;">Ref Commission</p>
                <h4 id="refEarnings">$0.00</h4>
            </div>
        </div>

        <div class="card" style="text-align: left;">
            <p style="text-align: center; margin-bottom: 5px; font-weight: bold;">Your Referral Link</p>
            <div class="ref-box" id="refLink">Loading...</div>
        </div>

        <div class="form-group">
            <label>Withdrawal Amount ($)</label>
            <input type="number" id="wAmount" placeholder="Enter amount to withdraw">
        </div>

        <button onclick="submitWithdrawal()">Withdraw Now</button>
        <button onclick="logout()" style="background: #ef4444; margin-top: 10px;">Logout</button>
    </div>
</div>

<script>
    let isLoginMode = false;

    // Check if user is already logged in
    window.onload = function() {
        let loggedUser = localStorage.getItem('df_logged_user');
        if (loggedUser) {
            showDashboard(loggedUser);
        }
        
        // Capture referral from URL if exists
        const urlParams = new URLSearchParams(window.location.search);
        const refBy = urlParams.get('ref');
        if (refBy) {
            localStorage.setItem('df_invited_by', refBy);
        }
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? "🔐 User Login" : "🔐 User Register";
        document.getElementById('authBtn').innerText = isLoginMode ? "Login" : "Register Now";
        document.getElementById('toggleText').innerText = isLoginMode ? "Register here" : "Login here";
    }

    function handleAuth() {
        let user = document.getElementById('username').value.trim();
        let pass = document.getElementById('password').value.trim();

        if (!user || !pass) {
            alert("Please fill in all fields!");
            return;
        }

        if (!isLoginMode) {
            // Registration logic
            localStorage.setItem('df_user_' + user, pass);
            localStorage.setItem('df_balance_' + user, "10.00"); // Bonus on signup
            localStorage.setItem('df_refs_' + user, "0");
            localStorage.setItem('df_ref_earn_' + user, "0.00");
            
            // Check if registered via referral
            let invitedBy = localStorage.getItem('df_invited_by');
            if (invitedBy && invitedBy !== user) {
                localStorage.setItem('df_u_inviter_' + user, invitedBy);
                // Give commission to inviter if stored locally
                let inviterRefs = parseInt(localStorage.getItem('df_refs_' + invitedBy) || "0") + 1;
                localStorage.setItem('df_refs_' + invitedBy, inviterRefs);
                let inviterEarn = parseFloat(localStorage.getItem('df_ref_earn_' + invitedBy) || "0.00") + 5.00;
                localStorage.setItem('df_ref_earn_' + invitedBy, inviterEarn.toFixed(2));
                let inviterBal = parseFloat(localStorage.getItem('df_balance_' + invitedBy) || "10.00") + 5.00;
                localStorage.setItem('df_balance_' + invitedBy, inviterBal.toFixed(2));
            }

            alert("Registration Successful! Welcome bonus $10 added.");
        } else {
            // Login logic
            let savedPass = localStorage.getItem('df_user_' + user);
            if (!savedPass || savedPass !== pass) {
                alert("Invalid username or password!");
                return;
            }
        }

        localStorage.setItem('df_logged_user', user);
        showDashboard(user);
    }

    function showDashboard(user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');

        let balance = localStorage.getItem('df_balance_' + user) || "10.00";
        let refs = localStorage.getItem('df_refs_' + user) || "0";
        let refEarn = localStorage.getItem('df_ref_earn_' + user) || "0.00";

        document.getElementById('userBalance').innerText = "$" + balance;
        document.getElementById('refCount').innerText = refs;
        document.getElementById('refEarnings').innerText = "$" + refEarn;

        const currentUrl = window.location.origin + window.location.pathname;
        document.getElementById('refLink').innerText = currentUrl + "?ref=" + user;
    }

    function submitWithdrawal() {
        let amount = document.getElementById('wAmount').value;
        if (!amount || amount <= 0) {
            alert("Please enter a valid withdrawal amount!");
            return;
        }
        alert("Withdrawal request of $" + amount + " submitted successfully! Status: Pending.");
        document.getElementById('wAmount').value = '';
    }

    function logout() {
        localStorage.removeItem('df_logged_user');
        location.reload();
    }
</script>

</body>
</html>
