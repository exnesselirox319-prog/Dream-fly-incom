<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Fly Income - Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; }
        .container { max-width: 400px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .card { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .card h3 { font-size: 24px; color: #4ade80; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input { width: 100%; padding: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #0284c7; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        .ref-box { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 13px; word-break: break-all; border: 1px dashed #38bdf8; margin-top: 5px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 Dream Fly Income</h2>
    
    <div class="card">
        <p>Total Balance</p>
        <h3 id="userBalance">$50.00</h3>
    </div>

    <div class="card" style="text-align: left;">
        <p style="text-align: center; margin-bottom: 5px; font-weight: bold;">Your Referral Link</p>
        <div class="ref-box" id="refLink">Loading...</div>
    </div>

    <div class="form-group">
        <label>Withdrawal Amount ($)</label>
        <input type="number" id="amount" placeholder="Enter amount">
    </div>

    <div class="form-group">
        <label>Account Password</label>
        <input type="password" id="password" placeholder="Enter password">
    </div>

    <button onclick="submitWithdrawal()">Withdraw Now</button>
</div>

<script>
    // Generate Unique Referral Link based on random ID or phone
    let userId = localStorage.getItem('df_user');
    if (!userId) {
        userId = 'DF' + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem('df_user', userId);
    }
    
    const currentUrl = window.location.origin + window.location.pathname;
    document.getElementById('refLink').innerText = currentUrl + "?ref=" + userId;

    function submitWithdrawal() {
        let amount = document.getElementById('amount').value;
        let password = document.getElementById('password').value;

        if(!amount || !password) {
            alert("Please fill all fields!");
            return;
        }

        alert("Withdrawal Request Submitted Successfully! Pending review.");
        document.getElementById('amount').value = '';
        document.getElementById('password').value = '';
    }
</script>

</body>
</html>
